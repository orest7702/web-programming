<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Запропонувати місто</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        color: #111827;
      }
      .container {
        max-width: 700px;
        margin: 60px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      label {
        font-weight: bold;
        margin-top: 8px;
      }
      input,
      textarea,
      select,
      button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 16px;
      }
      textarea {
        resize: vertical;
        min-height: 120px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background: #1d4ed8;
      }
      a {
        color: #2563eb;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Запропонувати місто для наступного рейтингу</h1>
      <form>
        <div>
          <label for="city">Назва міста:</label>
          <input type="text" id="city" name="city" required />
        </div>

        <div>
          <label for="country">Країна:</label>
          <input type="text" id="country" name="country" required />
        </div>

        <div>
          <label for="reason">Чому це місто варто додати?</label>
          <textarea id="reason" name="reason" required></textarea>
        </div>

        <div>
          <label for="category">Категорія:</label>
          <select id="category" name="category" required>
            <option value="">Оберіть категорію</option>
            <option value="history">Історія</option>
            <option value="culture">Культура</option>
            <option value="food">Кухня</option>
            <option value="nature">Природа</option>
          </select>
        </div>

        <div>
          <label for="rating">Рівень інтересу:</label>
          <select id="rating" name="rating">
            <option value="low">Низький</option>
            <option value="medium" selected>Середній</option>
            <option value="high">Високий</option>
          </select>
        </div>

        <button type="submit">Надіслати пропозицію</button>
      </form>

      <p style="margin-top: 20px;"><a href="index.html">Повернутися на головну</a></p>
    </div>
  </body>
</html>
